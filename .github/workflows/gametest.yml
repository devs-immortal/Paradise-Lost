name: Client Tests

on: [ pull_request ]
jobs:
  game_test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: microsoft
          java-version: 21

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Install Xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Run client tests
        run: xvfb-run -a -s "-screen 0 854x480x24" ./gradlew :fabric:runClientTest

      - name: Check all tests ran
        run: |
          if ! grep -q "(ClientTest) All tests passed" fabric/runs/clienttest/logs/latest.log; then
            echo "::error::Client test run did not finish. See the uploaded logs."
            exit 1
          fi

      - name: Upload test output
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: client-test-output
          path: |
            fabric/runs/clienttest/logs/latest.log
            fabric/runs/clienttest/screenshots/
            fabric/runs/clienttest/crash-reports/
          if-no-files-found: ignore
