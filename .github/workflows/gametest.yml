name: Game Tests

on:
  pull_request:
  workflow_dispatch:
    inputs:
      debug_minecart_float:
        description: Verbose minecart float log (paradise_lost.debug.minecart_float)
        type: boolean
        default: false
      debug_minecart_rotation:
        description: Minecart rotation tracing (paradise_lost.debug.minecart_rotation)
        type: boolean
        default: false

jobs:
  game_test:
    name: ${{ matrix.name }} tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Read by buildSrc (project-setup.gradle.kts), they win over gradle.properties. Always false on pull requests.
      DEBUG_MINECART_FLOAT: ${{ inputs.debug_minecart_float || false }}
      DEBUG_MINECART_ROTATION: ${{ inputs.debug_minecart_rotation || false }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Client
            task: runClientTest
            dir: clienttest
            logger: ClientTest
            xvfb: true
          - name: Compat
            task: runClientCompatTest
            dir: compattest
            logger: ClientTest
            xvfb: true
          - name: Server
            task: runServerTest
            dir: servertest
            logger: ServerTest
            xvfb: false
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: microsoft
          java-version: 21

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Install Xvfb
        if: matrix.xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Run tests
        run: ${{ matrix.xvfb && 'xvfb-run -a -s "-screen 0 854x480x24"' || '' }} ./gradlew :fabric:${{ matrix.task }}

      - name: Check all tests ran
        run: |
          if ! grep -q "(${{ matrix.logger }}) All tests passed" fabric/runs/${{ matrix.dir }}/logs/latest.log; then
            echo "::error::${{ matrix.name }} test run did not finish. See the uploaded logs."
            exit 1
          fi

      - name: Upload test output
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.dir }}-output
          path: |
            fabric/runs/${{ matrix.dir }}/logs/latest.log
            fabric/runs/${{ matrix.dir }}/screenshots/
            fabric/runs/${{ matrix.dir }}/crash-reports/
          if-no-files-found: ignore
