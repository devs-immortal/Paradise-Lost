name: Java CI with Gradle

on: [ pull_request ]
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Appended to the mod version by buildSrc, e.g. 2.5.1+abc1234. PRs use the head commit, not the merge commit.
      COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: microsoft
          java-version: 21

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew build

      - name: Upload Fabric build
        uses: actions/upload-artifact@v6
        with:
          name: paradise_lost-fabric
          path: |
            fabric/build/libs/*.jar
            !fabric/build/libs/*-sources.jar
          if-no-files-found: error

      - name: Upload NeoForge build
        uses: actions/upload-artifact@v6
        with:
          name: paradise_lost-neoforge
          path: |
            neoforge/build/libs/*.jar
            !neoforge/build/libs/*-sources.jar
          if-no-files-found: error

  checkstyle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: microsoft
          java-version: 21

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Checkstyle with Gradle
        run: ./gradlew checkstyleMain
