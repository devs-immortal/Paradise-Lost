name: Build

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch, tag, or commit SHA to build'
        required: true
        type: string
  push:
    branches:
      - $default-branch
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Appended to the mod version by buildSrc, e.g. 2.5.1+abc1234.
      COMMIT_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: microsoft
          java-version: 21

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew build

      - name: Upload Fabric build
        uses: actions/upload-artifact@v6
        with:
          name: paradise_lost-fabric
          path: |
            fabric/build/libs/*.jar
            !fabric/build/libs/*-sources.jar
          if-no-files-found: error

      - name: Upload NeoForge build
        uses: actions/upload-artifact@v6
        with:
          name: paradise_lost-neoforge
          path: |
            neoforge/build/libs/*.jar
            !neoforge/build/libs/*-sources.jar
          if-no-files-found: error
