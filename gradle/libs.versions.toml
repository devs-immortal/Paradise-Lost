# Common
    minecraft-range                 = "[1.21,)"
    minecraft                       = "1.21.1"
    parchment-minecraft             = "1.21.1"
    parchment                       = "2024.11.17"
    neoform                         = "1.21.1-20240808.144430"
    jopt-simple                     = "5.0.4"
    java                            = "21"
    jspecify                        = "1.0.0"

# Fabric
    fabric                          = "0.19.3"
    fabric-range                    = "0.18"
    fabric-api                      = "0.116.12+1.21.1"
    fabric-api-range                = "0.116.0+1.21.1"

# Neoforge
    neoforge-loader-range           = "[4,)"
    neoforge-range                  = "[21.1.200,)"
    neoforge                        = "21.1.238"

# Mixin
    mixin                           = "0.8.7"
    mixinextras                     = "0.5.4"
    mixinextras-range               = "[0.5.0,)"

# Plugins
    plugin-moddevgradle             = "2.0.141"
    plugin-minotaur                 = "2.9.0"
    plugin-curseforge-gradle        = "1.1.25"
    plugin-idea-ext                 = "1.4.1"
    plugin-mixin                    = "0.7.+"
    plugin-loom                     = "1.17-SNAPSHOT"

# See the below link for more information about version catalogues
# https://docs.gradle.org/current/userguide/version_catalogs.html

[libraries]
# Dependencies
    #geckolib-common        = { group = "software.bernie.geckolib", name = "geckolib-common-1.21.1",    version.ref = "geckolib" }
    #geckolib-neoforge      = { group = "software.bernie.geckolib", name = "geckolib-neoforge-1.21.1",  version.ref = "geckolib" }
    #geckolib-fabric        = { group = "software.bernie.geckolib", name = "geckolib-fabric-1.21.1",    version.ref = "geckolib" }
    #geckolib-forge         = { group = "software.bernie.geckolib", name = "geckolib-forge-1.21.1",     version.ref = "geckolib" }

# Mixin
    mixin                   = { group = "org.spongepowered",        name = "mixin",                     version.ref = "mixin" }
    mixinextras-common      = { group = "io.github.llamalad7",      name = "mixinextras-common",        version.ref = "mixinextras" }
    mixinextras-forge       = { group = "io.github.llamalad7",      name = "mixinextras-forge",         version.ref = "mixinextras" }

# Platform
    neoforge                = { group = "net.neoforged",            name = "neoforge",                  version.ref = "neoforge" }
    fabric                  = { group = "net.fabricmc",             name = "fabric-loader",             version.ref = "fabric" }
    fabric-api              = { group = "net.fabricmc.fabric-api",  name = "fabric-api",                version.ref = "fabric-api" }
    minecraft               = { group = "com.mojang",               name = "minecraft",                 version.ref = "minecraft" }

# Other
    jopt-simple             = { group = "net.sf.jopt-simple",       name = "jopt-simple",               version.ref = "jopt-simple" }
    jspecify                = { group = "org.jspecify",             name = "jspecify",                  version.ref = "jspecify" }

[plugins]
# Publishing
    minotaur                = { id = "com.modrinth.minotaur",                   version.ref = "plugin-minotaur" }
    curseforgegradle        = { id = "net.darkhax.curseforgegradle",            version.ref = "plugin-curseforge-gradle" }

# Platform
    moddevgradle            = { id = "net.neoforged.moddev",                    version.ref = "plugin-moddevgradle" }
    loom                    = { id = "fabric-loom",                             version.ref = "plugin-loom" }

# Misc
    ideaext                 = { id = "org.jetbrains.gradle.plugin.idea-ext",    version.ref = "plugin-idea-ext" }
    mixin                   = { id = "org.spongepowered.mixin",                 version.ref = "plugin-mixin" }